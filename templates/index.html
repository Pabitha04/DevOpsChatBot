<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps CI/CD Chatbot</title>

    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Fira Code', monospace;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #161b22;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #30363d;
        }

        header h1 {
            color: #58a6ff;
            margin: 0;
        }

        #repo-container {
            padding: 12px;
            background-color: #0d1117;
            border-bottom: 2px solid #30363d;
        }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #161b22;
            color: white;
            font-size: 1rem;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 10px 12px;
            border-radius: 10px;
            max-width: 80%;
            white-space: pre-line;
        }

        .user { background-color: #238636; align-self: flex-end; }
        .bot  { background-color: #30363d; border-left: 4px solid #58a6ff; }

        #input-area {
            display: flex;
            padding: 12px;
            border-top: 2px solid #30363d;
            background-color: #161b22;
        }

        #user-input {
            flex: 1;
            padding: 10px;
            font-size: 1rem;
            border-radius: 6px;
            border: none;
            outline: none;
            background-color: #0d1117;
            color: white;
        }

        #send-btn {
            margin-left: 10px;
            padding: 12px 18px;
            background-color: #58a6ff;
            color: black;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        #send-btn:hover { background-color: #1f6feb; }

    </style>
</head>

<body>
<header>
    <h1>⚙️ DevOps CI/CD Chatbot</h1>
</header>

<div id="repo-container">
    <select id="project-select">
        <option disabled selected>Loading repositories...</option>
    </select>
</div>

<div id="chat-box">
    <div class="bot message">
        🤖 Hi! I'm your CI/CD assistant.<br>
        Select a project and ask:<br>
        👉 Show latest build<br>
        👉 Show build history
    </div>
</div>

<div id="input-area">
    <input id="user-input" type="text" placeholder="Type a message..." onkeydown="handleKey(event)">
    <button id="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
const chatBox = document.getElementById("chat-box");

// ✅ Load repos into dropdown on page load
window.onload = async () => {
    const dropdown = document.getElementById("project-select");
    const res = await fetch("/projects");
    const data = await res.json();

    dropdown.innerHTML = `<option disabled selected>Select Project</option>`;
    data.projects.forEach(repo => {
        dropdown.innerHTML += `<option value="${repo}">${repo}</option>`;
    });
};

function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = `message ${sender}`;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// ✅ Send Chat Message
async function sendMessage() {
    const input = document.getElementById("user-input");
    const dropdown = document.getElementById("project-select");

    if (!dropdown.value) {
        alert("❗ Select a project first.");
        return;
    }

    addMessage(input.value, "user");

    const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            message: input.value,
            project: dropdown.value
        })
    });

    const data = await res.json();
    addMessage(data.reply, "bot");
    input.value = "";
}

// Hit ENTER to send
function handleKey(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
}
</script>

</body>
</html>
